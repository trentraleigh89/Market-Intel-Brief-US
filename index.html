// Activity-type classifier — heuristic fallback when flag.type isn't set.
function classifyActivityType(note) {
  const n = (note || '').toLowerCase();
  if (/\b(launch|launches|launching|product|series|rolls out|unveils|debut)\b/.test(n)) return 'Product';
  if (/\b(contract|deal|wins|won|awarded|installs?|installation|signed|partnership with|equipped)\b/.test(n)) return 'Contract';
  if (/\b(ceo|cfo|coo|chief|named|appoints?|appointed|joins as|hires|steps down|departs)\b/.test(n)) return 'Leadership';
  if (/\b(revenue|earnings|raises?|raised|funding|ipo|acquisition|acquires?|acquired|valuation|\$\d|€\d|£\d)\b/.test(n)) return 'Financial';
  if (/\b(partner|partnership|alliance|joins forces|collaborat)\b/.test(n)) return 'Partnership';
  return 'Strategic';
}

// -------------------- MAIN --------------------
function IntelBrief() {
  const [selectedId, setSelectedId] = useState(MONTHS[0].id);
  const [filter, setFilter] = useState('all');
  const [weekPickerOpen, setWeekPickerOpen] = useState(false);
  const [regionPickerOpen, setRegionPickerOpen] = useState(false);
  const [langBannerDismissed, setLangBannerDismissed] = useState(true); // default true; effect below sets to false if banner should show

  // -------- Language-detection nudge --------
  // On first visit, if browser language matches another region but the user is on this one,
  // surface a one-time banner suggesting the regional dashboard. Stored in localStorage so
  // the banner does not reappear after dismissal.
  const [suggestedRegion, setSuggestedRegion] = useState(null);
  useEffect(() => {
    try {
      if (typeof navigator === 'undefined') return;
      const dismissed = lsGet('lfhs_lang_banner_dismissed_v1', false);
      if (dismissed) return;
      const browserLang = (navigator.language || navigator.userLanguage || '').toString();
      if (!browserLang) return;
      // Find any OTHER region whose languageMatches contains this browser language
      const match = REGIONS.find(r => r.id !== REGION && r.languageMatches.some(l => browserLang.startsWith(l)));
      if (match) {
        setSuggestedRegion(match);
        setLangBannerDismissed(false);
      }
    } catch (e) { /* noop */ }
  }, []);
  const dismissLangBanner = () => {
    try { lsSet('lfhs_lang_banner_dismissed_v1', true); } catch (e) { /* noop */ }
    setLangBannerDismissed(true);
  };

  // -------- Ratings (thumbs up/down per insight) --------
  const [ratings, setRatings] = useState({});
  useEffect(() => { setRatings(lsGet(LS_RATINGS, {})); }, []);
  const handleRate = (id, value) => {
    setRatings(prev => {
      const next = { ...prev };
      if (prev[id] === value) delete next[id]; // toggle off if same value clicked
      else next[id] = value;
      lsSet(LS_RATINGS, next);
      return next;
    });
  };

  // -------- Brief-level helpfulness rating (one per week) --------
  const [briefRatings, setBriefRatings] = useState({});
  useEffect(() => { setBriefRatings(lsGet('lfhs_brief_level_ratings_v1', {})); }, []);
  const briefRating = briefRatings[selectedId];
  const handleBriefRate = (value) => {
    setBriefRatings(prev => {
      const next = { ...prev };
      if (prev[selectedId] === value) delete next[selectedId]; // toggle off if same
      else next[selectedId] = value;
      lsSet('lfhs_brief_level_ratings_v1', next);
      return next;
    });
    try {
      if (typeof window !== 'undefined' && window.plausible) {
        window.plausible(value === 'up' ? 'Brief Rated Helpful' : 'Brief Rated Not Helpful', {
          props: { issue: MONTHS.find(b => b.id === selectedId)?.issue || 'unknown' }
        });
      }
    } catch (e) { /* noop */ }
  };

  // -------- Bookmarks (saved snapshots) --------
  const [bookmarks, setBookmarks] = useState([]);
  useEffect(() => { setBookmarks(lsGet(LS_BOOKMARKS, [])); }, []);
  const bookmarkIds = useMemo(() => new Set(bookmarks.map(b => b.id)), [bookmarks]);
  const handleBookmark = (briefId, verticalId, idx, insight) => {
    const brief = BRIEFS.find(b => b.id === briefId);
    if (!brief) return;
    const id = insightId(briefId, verticalId, idx);
    setBookmarks(prev => {
      const exists = prev.some(b => b.id === id);
      const next = exists
        ? prev.filter(b => b.id !== id)
        : [...prev, buildBookmarkSnapshot(brief, verticalId, idx, insight)];
      lsSet(LS_BOOKMARKS, next);
      return next;
    });
  };
  const handleUnsave = (id) => {
    setBookmarks(prev => {
      const next = prev.filter(b => b.id !== id);
      lsSet(LS_BOOKMARKS, next);
      return next;
    });
  };

  const brief = useMemo(() => MONTHS.find(b => b.id === selectedId), [selectedId]);
  const trendingCapped = useMemo(() => (brief.trending || []).slice(0, 3), [brief]);
  const totalInsights = useMemo(
    () => Object.values(brief.verticals).reduce((s, arr) => s + arr.length, 0) + trendingCapped.length,
    [brief, trendingCapped]
  );

  const isSavedView = filter === 'saved';
  const showVerticals = !isSavedView && (filter === 'all' || VERTICALS_META.some(v => v.id === filter));
  const showTrending = !isSavedView && (filter === 'all' || filter === 'trending');
  const showFlags = !isSavedView;
  const showOneBig = !isSavedView;
  // Brief Metadata block is intentionally hidden from the final product. Code retained
  // for reference + diagnostics; flip SHOW_METADATA_UI to true to re-enable the render.
  const SHOW_METADATA_UI = false;

  const visibleVerticals = filter === 'all'
    ? VERTICALS_META
    : VERTICALS_META.filter(v => v.id === filter);

  const handlePrint = () => { try { window.print(); } catch (e) { /* noop */ } };

  return (
    <div style={{ background: C.bg, minHeight: '100vh', color: C.ink, fontFamily: FONT_BODY }} className="lfhs-bg-dots">
      <style>{`
        /* Montserrat (body) — Google Fonts; Prohibition (display) — base64 below */

        @font-face {
          font-family: 'Prohibition';
          src: url('data:font/otf;base64,${PROHIBITION_FONT_B64}') format('opentype');
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }

        /* LF/HS theme tokens — exposed as CSS variables for utility classes
           and any future component that wants to read them directly. */
        :root {
          --lfhs-bg:              ${C.bg};
          --lfhs-bg-dot:          ${C.bgDot};
          --lfhs-card:            ${C.surface};
          --lfhs-card-alt:        ${C.surfaceAlt};
          --lfhs-ink:             ${C.ink};
          --lfhs-line:            ${C.ink};
          --lfhs-line-soft:       ${C.lineSoft};
          --lfhs-red:             ${C.red};
          --lfhs-red-dark:        ${C.redDark};
          --lfhs-muted:           ${C.mute};
          --lfhs-muted-soft:      ${C.muteSoft};
          --lfhs-on-priority:     ${C.onPriority};
          --lfhs-on-priority-mute:${C.onPriorityMuted};
          --lfhs-on-priority-line:${C.onPriorityLine};
          --lfhs-radius-card:     15px;
          --lfhs-radius-chip:     9px;
          --lfhs-radius-pill:     999px;
          --lfhs-shadow-card:     ${SH.card};
          --lfhs-shadow-card-hover:${SH.cardHover};
          --lfhs-shadow-card-priority:${SH.cardPriority};
          --lfhs-shadow-card-priority-hover:${SH.cardPriorityHover};
        }

        /* Optional dotted page background — uses the bg-dot token at 23px grid */
        .lfhs-bg-dots {
          background-image: radial-gradient(${C.bgDot} 1px, transparent 1px);
          background-size: 23px 23px;
        }

        * { box-sizing: border-box; }
        body { margin: 0; }

        /* Tile grid — adapts to insight count per editorial layout rules:
           1 → wide single (avoid lonely card), 2 → 50/50, 3 → 3-col,

          gap: 22px;

        .tile-grid-3 { grid-template-columns: repeat(3, 1fr); }
        .tile-grid-2 { grid-template-columns: repeat(2, 1fr); }
        /* Single insight: occupies 2 of 3 implicit tracks so it reads substantial without stretching to full page width */
        .tile-grid-1 { grid-template-columns: repeat(3, 1fr); }
        .tile-grid-1 > * { grid-column: span 2; max-width: 560px; }
        /* 4 insights: 2 columns gives two clean rows of 50/50 */
        .tile-grid-4 { grid-template-columns: repeat(2, 1fr); }
        /* 5 insights: 6-col base; top row 3 cards at ~33% each, bottom row 2 at 50% each. */
        .tile-grid-5 { grid-template-columns: repeat(6, 1fr); }
        .tile-grid-5 > *:nth-child(-n+3) { grid-column: span 2; }
        .tile-grid-5 > *:nth-child(n+4) { grid-column: span 3; }
        /* 6 insights: standard 3-col, wraps to 3+3 */
        .tile-grid-6 { grid-template-columns: repeat(3, 1fr); }
        @media (max-width: 900px) {
          .tile-grid, .tile-grid-1, .tile-grid-2, .tile-grid-3, .tile-grid-4, .tile-grid-5, .tile-grid-6 {
            grid-template-columns: 1fr; gap: 16px;
          }
          .tile-grid-1 > *, .tile-grid-5 > * { grid-column: auto; max-width: none; }
          .tile-outer, .tile-inner, .tile-face { height: auto !important; min-height: 0 !important; overflow: visible !important; }
          .tile-context { -webkit-line-clamp: unset; display: block; }
          .tile-back-clamp { -webkit-line-clamp: unset; display: block; }
          .flag-note { -webkit-line-clamp: unset; display: block; }
        }

        /* Tile shell — offset hard shadow signature on hover */
        .tile-outer {
          perspective: 1600px;
          position: relative;
          cursor: pointer;
          min-height: 340px;
        }
        .tile-inner {
          position: relative;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          transition: transform 0.65s cubic-bezier(0.22,1,0.36,1);
          display: grid;
        }
        .tile-face {
          -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
          overflow: hidden;
          transition: transform 0.26s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.26s ease;
        }
        /* Headline clamp — caps at 3 lines so very long headlines stay contained. */
        .tile-headline {
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Context line-clamp — caps at 5 lines so cards fill naturally
           and front-face content stays balanced with the back face. */
        .tile-context {
          display: -webkit-box;
          -webkit-line-clamp: 5;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .tile-back-clamp {
          display: -webkit-box;
          -webkit-line-clamp: 8;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Back-face paragraph clamps via positional selectors so the back face
           caps to a height that balances the 5-line front context.
           1st direct-child div is the Competitive Implication block.
           2nd direct-child div is the Seller Conversation Starter block. */
        .tile-back > div:nth-child(1) > p {
          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .tile-back > div:nth-child(2) > p {
          display: -webkit-box;
          -webkit-line-clamp: 3;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Competitive flag note clamp — safety net only.
           Week 20+ rule: notes should be summarized at intel-pull authoring
           to fit 10 rendered lines. This clamp prevents layout breaks if a
           note slips past the rule. */
        .flag-note {
          display: -webkit-box;
          -webkit-line-clamp: 10;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        /* Both faces share the same grid cell. The cell's height becomes
           max(front content, back content), so the card naturally grows to
           fit whichever face is taller. No scrolling required, no overflow
           bleed into adjacent UI. The 3D rotation on .tile-inner still flips
           between faces; backface-visibility hides the inactive face. */
        .tile-front {
          grid-column: 1;
          grid-row: 1;
        }
        .tile-back {
          grid-column: 1;
          grid-row: 1;
          transform: rotateY(180deg);
        }
        /* Lift the tile on hover with the offset hard shadow's heavier variant.
           Priority tiles use the red-dark shadow variant. */
        .tile-outer:hover .tile-face:not(.tile-back) {
          transform: translateY(-5px);
          box-shadow: ${SH.cardHover};
        }
        .tile-outer:hover .tile-face.tile-front[style*="${C.redDark}"] {
          /* Note: style-attr substring matching is a hack but works for inline-styled priority surfaces. */
          box-shadow: ${SH.cardPriorityHover};
        }

        /* Button hovers */
        .btn-flip[data-priority="false"]:hover {
          background: ${C.red} !important; color: ${C.surface} !important;
        }
        .btn-flip[data-priority="true"]:hover {
          background: rgba(255,255,255,0.12) !important;

        .tile-bookmark:hover { color: ${C.red} !important; transform: scale(1.08); }

        @media (max-width: 640px) {
          .brand-desktop { display: none !important; }
          .brand-mobile { display: flex !important; }
          .hero-wrap { padding: 20px 16px 12px !important; }
          .hero-title { font-size: 32px !important; }
          .hero-flex { flex-direction: column !important; align-items: stretch !important; gap: 12px !important; }
          .hero-right { align-items: flex-end !important; gap: 0 !important; width: 100%; }
          .hero-helpfulness { display: none !important; }
          .content-wrap { padding: 24px 16px 40px !important; }
          .sop-list li { font-size: 13px !important; }
          .flag-row { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; }
          .flag-row > div { width: auto !important; }
          .one-big-body { font-size: 14px !important; }
          /* Filter row — quiet the label, shrink gaps, smaller pills so the row fits one line on most phones */
          .filter-label { display: none !important; }
          .filter-row { gap: 5px !important; margin-bottom: 24px !important; }
          .filter-chip, .filter-chip-select {
            font-size: 9px !important; padding: 4px 8px !important; letter-spacing: 0.05em !important;
          }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

          .tile-inner { transform: none !important; transform-style: flat !important; }
          .tile-face { position: relative !important; inset: auto !important; transform: none !important; backface-visibility: visible !important; break-inside: avoid; }
          .tile-context, .tile-back-clamp, .flag-note { -webkit-line-clamp: unset !important; display: block !important; overflow: visible !important; }

          section { break-inside: avoid; }

            fontFamily: FONT_DISPLAY, fontWeight: 400,
            fontSize: 24, lineHeight: 1.12, letterSpacing: '0.006em',
            color: C.ink,
          }}>
            {brief.oneBigIdea.headline}
          </h3>
          <p className="one-big-body" style={{
            margin: 0, paddingLeft: 8, fontFamily: FONT_BODY,
            fontSize: 14.5, lineHeight: 1.55, color: C.inkBody,
          }}>
            {brief.oneBigIdea.body}
          </p>
        </div>
      </div>

      {/* ============ FILTER ============ */}
      <div className="content-wrap" style={{ maxWidth: 1180, margin: '0 auto', padding: '36px 32px 44px' }}>
        {renderMonthSupporting(brief, isSavedView)}
        <div className="no-print filter-row" style={{
          display: 'flex', alignItems: 'center', gap: 6,
          marginBottom: 36, flexWrap: 'wrap',
        }}>
          <span className="filter-label" style={{
            fontFamily: FONT_BODY,
            fontSize: 10, fontWeight: 700, letterSpacing: '0.10em', textTransform: 'uppercase',
            color: C.muteSoft, marginRight: 4, display: 'flex', alignItems: 'center', gap: 5,
          }}>
            <Filter size={10} strokeWidth={2} /> Filter
          </span>

          {/* Vertical dropdown — native select for mobile-OS picker + accessibility.
              Styled to read like a chip so it sits naturally in the row. */}
          {(() => {
            const verticalActive = filter === 'all' || VERTICALS_META.some(v => v.id === filter);
            const selectValue = verticalActive ? filter : 'all';
            return (
              <div style={{ position: 'relative', display: 'inline-flex', alignItems: 'center' }}>
                <select
                  value={selectValue}
                  onChange={(e) => setFilter(e.target.value)}
                  className={`filter-chip-select ${verticalActive ? 'active' : ''}`}
                  style={{
                    appearance: 'none', WebkitAppearance: 'none', MozAppearance: 'none',
                    fontFamily: FONT_BODY,
                    fontSize: 9.5, fontWeight: 700,
                    letterSpacing: '0.06em', textTransform: 'uppercase',
                    padding: '5px 24px 5px 10px',
                    border: `1.5px solid ${verticalActive ? C.ink : C.borderHi}`,
                    borderRadius: 999,
                    background: verticalActive ? C.ink : 'transparent',
                    color: verticalActive ? C.surface : C.ink,
                    cursor: 'pointer', outline: 'none', minWidth: 0,
                  }}
                >
                  <option value="all">All Verticals</option>
                  {VERTICALS_META.map(v => (
                    <option key={v.id} value={v.id}>{v.name}</option>
                  ))}
                </select>
                <ChevronDown
                  size={11} strokeWidth={2.5}
                  color={verticalActive ? C.surface : C.ink}
                  style={{ position: 'absolute', right: 8, pointerEvents: 'none' }}
                />
              </div>
            );
          })()}

          {/* Three remaining chips: Saved, Trending, Competitive */}
          {[
            { id: 'saved',       label: 'Saved',       icon: Bookmark, count: bookmarks.length },
            { id: 'trending',    label: 'Trending',    icon: Flame,    count: null },
            { id: 'competitive', label: 'Competitive', icon: Shield,   count: null, scrollTo: 'competitive-flags-section' },
          ].map(chip => {
            const active = filter === chip.id;
            const ChipIcon = chip.icon;
            const handleChipClick = () => {
              if (chip.scrollTo) {
                if (filter === 'saved') setFilter('all');
                setTimeout(() => {
                  const el = document.getElementById(chip.scrollTo);
                  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, filter === 'saved' ? 80 : 0);
                return;
              }
              setFilter(chip.id);
            };
            return (
              <button key={chip.id} onClick={handleChipClick}
                className={`filter-chip ${active ? 'active' : ''}`}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 5,
                  padding: '5px 10px',
                  fontFamily: FONT_BODY,
                  fontSize: 9.5, fontWeight: 700,
                  letterSpacing: '0.06em', textTransform: 'uppercase',
                  border: `1.5px solid ${active ? C.ink : C.borderHi}`,
                  borderRadius: 999,
                  background: active ? C.ink : 'transparent',
                  color: active ? C.surface : C.ink,
                  cursor: 'pointer', whiteSpace: 'nowrap',
                  transition: 'all 0.2s',
                }}>
                {ChipIcon && <ChipIcon size={10} strokeWidth={2.5}
                  fill={chip.id === 'saved' && bookmarks.length > 0 ? (active ? C.surface : C.red) : 'none'}
                  color={active ? C.surface : (chip.id === 'saved' && bookmarks.length > 0 ? C.red : C.ink)} />}
                {chip.label}
                {chip.count !== null && chip.count > 0 && (
                  <span style={{
                    fontFamily: FONT_BODY,
                    fontSize: 9, fontWeight: 700,
                    padding: '1px 6px', borderRadius: 999,
                    background: active ? 'rgba(255,255,255,0.18)' : C.surface,
                    color: active ? C.surface : C.red,
                    border: active ? '1px solid rgba(255,255,255,0.25)' : `1px solid ${C.red}`,
                    marginLeft: 1,
                  }}>{chip.count}</span>
                )}
              </button>
            );
          })}
        </div>

        {/* SAVED VIEW */}
        {isSavedView && (
          <SavedInsightsView
            bookmarks={bookmarks}
            ratings={ratings}
            onRate={handleRate}
            onUnsave={handleUnsave}
          />
        )}

        {/* TRENDING SECTION — moved above verticals so reps see cross-vertical patterns first */}
        {showTrending && trendingCapped.length > 0 && (
          <section style={{ marginTop: 0, marginBottom: 32 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
              <div style={{
                width: 32, height: 32, borderRadius: 9,
                background: C.surface, color: C.red,
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                border: `1.75px solid ${C.red}`,
              }}>
                <Flame size={15} strokeWidth={2.5} color={C.red} />
              </div>
              <h2 style={{
                margin: 0,
                fontFamily: FONT_DISPLAY, fontWeight: 400,
                fontSize: 22, lineHeight: 1.10, letterSpacing: '0.01em',
                color: C.red,
              }}>Trending</h2>
              <span style={{
                fontFamily: FONT_BODY,
                fontSize: 10, fontWeight: 700, letterSpacing: '0.10em', textTransform: 'uppercase',
                padding: '3px 10px', borderRadius: 999,
                background: 'transparent', color: C.ink,
                border: `1.5px solid ${C.borderHi}`,
              }}>{trendingCapped.length} {trendingCapped.length === 1 ? 'pattern' : 'patterns'}</span>
              <span style={{
                fontFamily: FONT_BODY,
                fontSize: 12, color: C.mute, fontStyle: 'italic',
              }}>
                Cross-vertical patterns from this and recent briefs.
              </span>
            </div>
            <div className={`tile-grid tile-grid-${Math.min(trendingCapped.length, 3)}`}>
              {trendingCapped.map((t, i) => <TrendingTile key={i} item={t} />)}
            </div>
          </section>
        )}

        {/* VERTICAL SECTIONS */}
        {showVerticals && visibleVerticals.map(meta => (
          <VerticalSectionMonthly
            key={meta.id}
            meta={meta}
            insights={brief.verticals[meta.id]}
            briefId={brief.id}
            bookmarkIds={bookmarkIds}
            ratings={ratings}
            onBookmark={handleBookmark}
            onRate={handleRate}
          />
        ))}

        {/* (Trending section formerly here — now rendered above verticals) */}

        {/* COMPETITIVE FLAGS */}
        {showFlags && (
        <section id="competitive-flags-section" style={{ marginTop: 20, marginBottom: 32, scrollMarginTop: 80 }}>
          <CompetitiveFlagsMonthly flags={brief.flags} briefId={brief.id} />
        </section>
        )}

        {/* ONE BIG IDEA — now rendered at top of brief, removed from this position */}

        {/* METADATA */}
        {showMetadata && (
        <section>
          <div style={{
            background: C.surface, border: `1.5px solid ${C.borderHi}`,
            borderRadius: 15, padding: '18px 22px',
            boxShadow: SH.card,
          }}>
            <div style={{
              fontFamily: FONT_BODY,
              fontSize: 10.5, fontWeight: 700, letterSpacing: '0.10em', textTransform: 'uppercase',
              color: C.mute, marginBottom: 12,
            }}>
              Brief Metadata
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: 14 }}>
              {[
                ['Date range', brief.weekRange],
                ['Verticals', String(VERTICALS_META.length)],
                ['Competitors', '8'],
                ['Processed', brief.metadata.processed],
                ['Delivered', brief.metadata.delivered],
              ].map(([label, val], i) => (
                <div key={i}>
                  <div style={{
                    fontFamily: FONT_BODY,
                    fontSize: 9.5, color: C.mute, fontWeight: 700,
                    letterSpacing: '0.10em', textTransform: 'uppercase', marginBottom: 4,
                  }}>{label}</div>
                  <div style={{
                    fontFamily: FONT_BODY,
                    fontSize: 13, fontWeight: 600, color: C.ink,
                  }}>{val}</div>
                </div>
              ))}
            </div>
            <div style={{
              fontFamily: FONT_BODY,
              fontSize: 11.5, color: C.mute, fontStyle: 'italic',
              marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.lineSoft}`,
            }}>
              {brief.metadata.dedup}
            </div>
          </div>
          <div style={{
            textAlign: 'center', marginTop: 22,
            fontFamily: FONT_BODY,
            fontSize: 10, color: C.muteSoft, letterSpacing: '0.14em', textTransform: 'uppercase', fontWeight: 700,
          }}>
            Life Fitness / Hammer Strength · Competitive Intelligence · Confidential
          </div>
        </section>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
const initialLoader = document.getElementById('initial-loader');
if (initialLoader) initialLoader.remove();
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(IntelBrief));
</script>
</body>
</html>
